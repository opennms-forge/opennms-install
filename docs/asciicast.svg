  <rect width="100%" height="100%" style="fill: #121314" rx="4" ry="4"></rect>

  <svg x="8.42333333" y="9.333331000000001" class="default-text-fill">
    <image x="0" y="0" width="1179.2666662" height="746.6664800000001" href="data:image/png;base64," preserveAspectRatio="none" style="image-rendering: pixelated; image-rendering: crisp-edges;"></image>

    <text xml:space="preserve" class="term-text" style="fill: #cccccc">
      <tspan y="0.0">
        <tspan dy="1em" x="0.0">If you get any errors during the install procedure please visit the                                                                         </tspan>
      </tspan><tspan y="18.666662000000002">
        <tspan dy="1em" x="0.0">bootstrap.log where you can find detailed error messages for                                                                                </tspan>
      </tspan><tspan y="37.333324000000005">
        <tspan dy="1em" x="0.0">diagnose and bug reporting.                                                                                                                 </tspan>
      </tspan><tspan y="55.99998600000001">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="74.66664800000001">
        <tspan dy="1em" x="0.0">Bugs or enhancements can be reported here:                                                                                                  </tspan>
      </tspan><tspan y="93.33331000000001">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="111.99997200000001">
        <tspan dy="1em" x="0.0"> - https://github.com/opennms-forge/opennms-install/issues -                                                                                </tspan>
      </tspan><tspan y="130.66663400000002">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="149.33329600000002">
        <tspan dy="1em" x="0.0">If you want to proceed, type YES: yes                                                                                                       </tspan>
      </tspan><tspan y="167.99995800000002">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="186.66662000000002">
        <tspan dy="1em" x="0.0">🚀</tspan><tspan x="16.84666666"> Starting setup procedure                                                                                                                  </tspan>
      </tspan><tspan y="205.33328200000003">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="223.99994400000003">
        <tspan dy="1em" x="0.0">Authenticate with sudo                ...                                                                                                   </tspan>
      </tspan><tspan y="242.66660600000003">
        <tspan dy="1em" x="0.0">[sudo] password for indigo:                                                                                                                 </tspan>
      </tspan><tspan y="261.33326800000003">
        <tspan dy="1em" x="0.0">[ </tspan><tspan x="16.84666666" style="fill: #4ebf22">OK</tspan><tspan x="33.69333332"> ]                                                                                                                                      </tspan>
      </tspan><tspan y="279.99993">
        <tspan dy="1em" x="0.0">Update APT cache                      ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="298.66659200000004">
        <tspan dy="1em" x="0.0">Install curl and gnupg2               ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="317.333254">
        <tspan dy="1em" x="0.0">Install OpenJDK Development Kit       ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="335.99991600000004">
        <tspan dy="1em" x="0.0">Install PostgreSQL database           ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="354.666578">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="373.33324000000005">
        <tspan dy="1em" x="0.0">Set a Postgres root password                                                                                                                </tspan>
      </tspan><tspan y="391.999902">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="410.66656400000005">
        <tspan dy="1em" x="0.0">New postgres password:                                                                                                                      </tspan>
      </tspan><tspan y="429.333226">
        <tspan dy="1em" x="0.0">Confirm postgres password:                                                                                                                  </tspan>
      </tspan><tspan y="447.99988800000006">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="466.66655000000003">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="485.33321200000006">
        <tspan dy="1em" x="0.0">Create OpenNMS Horizon database with user credentials                                                                                       </tspan>
      </tspan><tspan y="503.99987400000003">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="522.6665360000001">
        <tspan dy="1em" x="0.0">Database name for OpenNMS Horizon (default: opennms): opennms                                                                               </tspan>
      </tspan><tspan y="541.333198">
        <tspan dy="1em" x="0.0">User for the database: opennms                                                                                                              </tspan>
      </tspan><tspan y="559.99986">
        <tspan dy="1em" x="0.0">New password:                                                                                                                               </tspan>
      </tspan><tspan y="578.6665220000001">
        <tspan dy="1em" x="0.0">Confirm password:                                                                                                                           </tspan>
      </tspan><tspan y="597.3331840000001">
        <tspan dy="1em" x="0.0">                                                                                                                                            </tspan>
      </tspan><tspan y="615.999846">
        <tspan dy="1em" x="0.0">Enable SCRAM-SHA-256 in PostgreSQL    ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="634.666508">
        <tspan dy="1em" x="0.0">Restart PostgreSQL Server             ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="653.33317">
        <tspan dy="1em" x="0.0">Create database and users             ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="671.9998320000001">
        <tspan dy="1em" x="0.0">Install OpenNMS GPG Key               ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="690.6664940000001">
        <tspan dy="1em" x="0.0">Install Horizon Repository            ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="709.333156">
        <tspan dy="1em" x="0.0">Update APT cache                      ... [ </tspan><tspan x="370.62666652" style="fill: #4ebf22">OK</tspan><tspan x="387.47333318"> ]                                                                                            </tspan>
      </tspan><tspan y="727.999818">
        <tspan dy="1em" x="0.0">Install OpenNMS Horizon packages      ... </tspan><tspan x="353.77999986000003" style="fill: #000000"> </tspan><tspan x="362.20333319">                                                                                                 </tspan>
      </tspan>
    </text>
  </svg>

