name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: "Quality gates"
    uses: ./.github/workflows/integration-tests.yml

  release:
    name: "Draft release"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: gate
    permissions:
      contents: write      # create the draft release and upload assets
      id-token: write      # cosign keyless signing
      attestations: write  # build provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Assemble artifacts
        run: |
          mkdir -p dist
          cp bootstrap-debian.sh bootstrap-yum.sh dist/
          cd dist
          sha256sum bootstrap-debian.sh bootstrap-yum.sh > SHA256SUMS

      - name: Sign checksums with cosign keyless
        # cosign v3 defaults to the sigstore bundle format; the former
        # --output-signature/--output-certificate flags are deprecated no-ops.
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/bootstrap-debian.sh
            dist/bootstrap-yum.sh
            dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "${TAG}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${TAG}" --draft --verify-tag --title "${TAG}" ${PRERELEASE} dist/*
