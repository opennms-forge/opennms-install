name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          sudo mv ./actionlint /usr/local/bin/actionlint

      - name: Run linters
        run: make lint

  integration-test:
    name: "${{ matrix.distro }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "Debian 13 (Trixie)"
            image: "debian:trixie"
            script: "bootstrap-debian.sh"
          - distro: "Ubuntu 24.04 LTS"
            image: "ubuntu:24.04"
            script: "bootstrap-debian.sh"
          - distro: "CentOS Stream 9"
            image: "quay.io/centos/centos:stream9"
            script: "bootstrap-yum.sh"
          - distro: "CentOS Stream 10"
            image: "quay.io/centos/centos:stream10"
            script: "bootstrap-yum.sh"
          - distro: "AlmaLinux 9"
            image: "almalinux:9"
            script: "bootstrap-yum.sh"
          - distro: "AlmaLinux 10"
            image: "almalinux:10"
            script: "bootstrap-yum.sh"
          - distro: "Rocky Linux 9"
            image: "rockylinux/rockylinux:9"
            script: "bootstrap-yum.sh"
          - distro: "Rocky Linux 10"
            image: "rockylinux/rockylinux:10"
            script: "bootstrap-yum.sh"
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Run integration test
        run: make integration-test IMAGE="${{ matrix.image }}" SCRIPT="${{ matrix.script }}"
