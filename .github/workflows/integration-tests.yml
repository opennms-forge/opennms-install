name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets the release workflow reuse these quality gates instead of
  # duplicating them.
  workflow_call:
  # Weekly expiry alarm for the certified-combo pins: debian.opennms.org
  # serves only the newest release, so the deb pin breaks when upstream
  # publishes and this run fails until the pin is bumped.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          sudo mv ./actionlint /usr/local/bin/actionlint

      - name: Run linters
        run: make lint

  integration-test:
    name: "${{ matrix.distro }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "Debian 13 (Trixie)"
            image: "debian:trixie"
            script: "bootstrap-debian.sh"
          - distro: "Ubuntu 24.04 LTS"
            image: "ubuntu:24.04"
            script: "bootstrap-debian.sh"
          - distro: "CentOS Stream 9"
            image: "quay.io/centos/centos:stream9"
            script: "bootstrap-yum.sh"
          - distro: "CentOS Stream 10"
            image: "quay.io/centos/centos:stream10"
            script: "bootstrap-yum.sh"
          - distro: "AlmaLinux 9"
            image: "almalinux:9"
            script: "bootstrap-yum.sh"
          - distro: "AlmaLinux 10"
            image: "almalinux:10"
            script: "bootstrap-yum.sh"
          - distro: "Rocky Linux 9"
            image: "rockylinux/rockylinux:9"
            script: "bootstrap-yum.sh"
          - distro: "Rocky Linux 10"
            image: "rockylinux/rockylinux:10"
            script: "bootstrap-yum.sh"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run integration test
        run: make integration-test IMAGE="${{ matrix.image }}" SCRIPT="${{ matrix.script }}"

  # Single aggregate check for branch protection: requiring this one context
  # survives matrix renames and additions.
  gate:
    name: "Gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, integration-test]
    if: always()
    steps:
      - name: Fail unless all gated jobs succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "integration-test: ${{ needs.integration-test.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.integration-test.result }}" != "success" ]; then
            exit 1
          fi
